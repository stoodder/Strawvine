name: CI

# Pushes to the main branches and Claude's work branches, plus pull requests — a branch with an
# open PR isn't built twice for every push.
on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:
  schedule:
    # Weekly, independent of code changes: the dependency audit (`audit`) and the export →
    # restore round trip (`restore-check`; it also runs in `check` on every push).
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every action is pinned to a full commit SHA (the tag it was resolved from in the comment), so a
# moved or compromised tag can't change what runs. To update one: resolve the new tag with
#   git ls-remote https://github.com/<owner>/<repo> refs/tags/<tag>   (use the ^{} line for an annotated tag)
# and replace both the SHA and the comment (Dependabot's github-actions updates do the same).
# Runtime: these majors (checkout v7, setup-node v7, cache v6, upload-artifact v7; resolved
# 2026-11-02) run on Node 24 — the v4 majors used before ran on the deprecated Node 20 runtime.
# Take later majors when Dependabot proposes them, after reading their breaking changes.
#
# The Postgres service image is pinned by digest too (the multi-arch index of
# public.ecr.aws/docker/library/postgres:16-alpine, PG 16.15, resolved 2026-11-02). To update:
#   TOKEN=$(curl -s "https://public.ecr.aws/token/?scope=repository:docker/library/postgres:pull" | jq -r .token)
#   curl -sI -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.oci.image.index.v1+json" \
#     https://public.ecr.aws/v2/docker/library/postgres/manifests/16-alpine | grep -i docker-content-digest

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        # Docker Hub's library image via its public ECR mirror (no Docker Hub pull limits), by digest.
        image: public.ecr.aws/docker/library/postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/strawvine_test
      E2E_DATABASE_URL: postgres://postgres@localhost:5432/strawvine_e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No token left in .git for later steps (npm scripts, the app) to find.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Create the test database
        run: psql -h localhost -U postgres -c 'create database strawvine_test'

      - name: Typecheck
        run: npm run typecheck

      - name: Style lint
        run: npm run check:style -- --strict

      - name: Migrations match the schema (drizzle drift)
        run: |
          npx drizzle-kit generate --name drift-check
          if [ -n "$(git status --porcelain drizzle/)" ]; then
            echo "::error::src/server/db/schema.ts changed without a migration. Run 'npm run db:generate' and commit drizzle/."
            git status --porcelain drizzle/
            exit 1
          fi

      - name: Unit, API and component tests
        run: npm test

      - name: Build
        run: npm run build

      # ~3 s: an export restores into a fresh database and exports again unchanged (every column).
      - name: Export → restore → export round trip
        run: node scripts/restore-check.mjs
        env:
          RESTORE_CHECK_DATABASE_URL: postgres://postgres@localhost:5432/strawvine_restore_check
          RESTORE_CHECK_OUT: ${{ github.workspace }}/restore-check

      # Browsers depend on the Playwright version only: an unrelated lockfile change keeps the cache.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium for Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium's system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Totals, flaky tests (failed, then passed on retry) and fixme notes go to the job summary.
      - name: End-to-end tests
        run: npm run e2e
        env:
          E2E_SKIP_BUILD: "1"

      # Every text on the main screens against the pixels behind it (4.5:1, 7:1 in high contrast).
      # Reports (job summary + a warning) without failing the build for now; add --strict once
      # it is clean.
      - name: Contrast audit
        if: success() || failure()
        continue-on-error: true
        run: npm run audit:contrast
        env:
          CONTRAST_AUDIT_DATABASE_URL: postgres://postgres@localhost:5432/strawvine_contrast_audit
          CONTRAST_AUDIT_OUT: ${{ github.workspace }}/contrast-audit

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            e2e/.report
            e2e/.results
          retention-days: 7

      - name: Upload the restore-check exports and contrast audit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: restore-check-and-contrast-audit
          path: |
            restore-check
            contrast-audit
          if-no-files-found: ignore
          retention-days: 7

  # A new advisory in some dependency shouldn't fail an unrelated change: on pushes and PRs the
  # audit reports (job summary + warning) without blocking; the weekly scheduled run fails loudly.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: ${{ github.event_name != 'schedule' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No token left in .git for later steps (npm scripts, the app) to find.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Audit production dependencies
        run: |
          set +e
          npm audit --omit=dev --audit-level=high > audit.txt 2>&1
          status=$?
          {
            echo "### npm audit (production dependencies)"
            echo '```'
            tail -n 40 audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ $status -ne 0 ]; then
            echo "::warning::npm audit found high-severity advisories in production dependencies (see the job summary)."
          fi
          exit $status

  docker:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No token left in .git for later steps (npm scripts, the app) to find.
          persist-credentials: false
      - name: Build the production image
        run: docker build --build-arg BUILD_ID=${{ github.sha }} -t strawvine:ci .

  # Weekly (and on demand), besides every run of `check`: an export must restore into a fresh
  # database and export again unchanged — seeds a dataset with every column set through the API,
  # GET /api/export, restores it with dist/server/restore.js into a second database, exports again
  # and diffs (ignoring exportedAt).
  restore-check:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RESTORE_CHECK_DATABASE_URL: postgres://postgres@localhost:5432/strawvine_restore_check
      RESTORE_CHECK_OUT: ${{ github.workspace }}/restore-check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No token left in .git for later steps (npm scripts, the app) to find.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Export → restore → export round trip
        run: node scripts/restore-check.mjs

      - name: Upload the exports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: restore-check-exports
          path: restore-check
          retention-days: 7
