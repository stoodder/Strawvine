name: CI

# Pushes to the main branches and Claude's work branches, plus pull requests — a branch with an
# open PR isn't built twice for every push.
on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:
  schedule:
    # Weekly, independent of code changes: the dependency audit (`audit`) and the export →
    # restore round trip (`restore-check`).
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every action is pinned to a full commit SHA (the tag it was resolved from in the comment), so a
# moved or compromised tag can't change what runs. To update one: resolve the new tag with
#   git ls-remote https://github.com/<owner>/<repo> refs/tags/<tag>
# and replace both the SHA and the comment (Dependabot's github-actions updates do the same).

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        # Docker Hub's library image via its public ECR mirror (no Docker Hub pull limits).
        image: public.ecr.aws/docker/library/postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/strawvine_test
      E2E_DATABASE_URL: postgres://postgres@localhost:5432/strawvine_e2e
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Create the test database
        run: psql -h localhost -U postgres -c 'create database strawvine_test'

      - name: Typecheck
        run: npm run typecheck

      - name: Style lint
        run: npm run check:style -- --strict

      - name: Migrations match the schema (drizzle drift)
        run: |
          npx drizzle-kit generate --name drift-check
          if [ -n "$(git status --porcelain drizzle/)" ]; then
            echo "::error::src/server/db/schema.ts changed without a migration. Run 'npm run db:generate' and commit drizzle/."
            git status --porcelain drizzle/
            exit 1
          fi

      - name: Unit, API and component tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium for Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium's system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: End-to-end tests
        run: npm run e2e
        env:
          E2E_SKIP_BUILD: "1"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            e2e/.report
            e2e/.results
          retention-days: 7

  # A new advisory in some dependency shouldn't fail an unrelated change: on pushes and PRs the
  # audit reports (job summary + warning) without blocking; the weekly scheduled run fails loudly.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: ${{ github.event_name != 'schedule' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Audit production dependencies
        run: |
          set +e
          npm audit --omit=dev --audit-level=high > audit.txt 2>&1
          status=$?
          {
            echo "### npm audit (production dependencies)"
            echo '```'
            tail -n 40 audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ $status -ne 0 ]; then
            echo "::warning::npm audit found high-severity advisories in production dependencies (see the job summary)."
          fi
          exit $status

  docker:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build the production image
        run: docker build --build-arg BUILD_ID=${{ github.sha }} -t strawvine:ci .

  # Weekly (and on demand): an export must restore into a fresh database and export again
  # unchanged — seeds a small dataset through the API, GET /api/export, restores it with
  # dist/server/restore.js into a second database, exports again and diffs (ignoring exportedAt).
  restore-check:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RESTORE_CHECK_DATABASE_URL: postgres://postgres@localhost:5432/strawvine_restore_check
      RESTORE_CHECK_OUT: ${{ github.workspace }}/restore-check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Export → restore → export round trip
        run: node scripts/restore-check.mjs

      - name: Upload the exports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: restore-check-exports
          path: restore-check
          retention-days: 7
